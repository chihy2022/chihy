<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Transformation - Unime System</title>
    
    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Thư viện jQuery (BẮT BUỘC ĐỂ CHẠY ĐƯỢC JS) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="chihy-shot-wrapper">
    <div class="chihy-card">
        <!-- <ul class="nav-tabs">
            <li class="tab-item active">List</li>
        </ul> -->

        <div class="tab-content">
            <div id="tab-list" class="tab-pane active">
                <div class="filter-toolbar">
                    <div class="filter-group">
                        <span class="filter-label">Loại ID:</span>
                        <label class="custom-check">
                            <!-- Thêm disabled để không cho bỏ tick Task -->
                            <input type="checkbox" id="filterParent" checked disabled> 
                            <span class="checkmark"></span> Task
                        </label>
                        <label class="custom-check">
                            <!-- Đổi sang hàm handleGlobalDetail khi thay đổi trạng thái Detail -->
                            <input type="checkbox" id="filterChild" onchange="handleGlobalDetail(this)">
                            <span class="checkmark"></span> Detail
                        </label>
                    </div>

                    <div class="filter-group">
                        <span class="filter-label">Trạng thái:</span>
                        <div id="status-filter-container" class="pills-row"></div>
                    </div>

                    <div class="filter-actions">
                        <span onclick="clearAllFilters()" class="clear-btn">Clear Filter</span>
                        <div id="filter-summary" class="summary-text">Đang tải dữ liệu...</div>
                    </div>
                </div>

                <div class="table-container">
                    <table class="modern-table">
                        <thead>
                            <tr>
                                <th style="width: 150px;">Session / A/U</th>
                                <th style="width: 350px;">Đầu việc & Tiến độ</th>
                                <th>Nội dung chi tiết</th>
                                <th style="width: 80px;">Ưu tiên</th>
                                <th style="width: 320px;">Ghi chú</th>
                                <th style="width: 100px;">Trạng thái</th>
                                <th style="width: 120px;">Timeline</th>
                                <th style="width: 120px;">Thực tế</th>
                            </tr>
                        </thead>
                        <tbody id="digital-table-body">
                            <!-- Dữ liệu sẽ tự động đổ vào đây -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Link JS -->
<script src="script.js"></script>
</body>
</html>
