<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unime System Dashboard</title>
    
    <!-- FONT CHỮ & CSS HỆ THỐNG -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">

    <!-- THƯ VIỆN HỖ TRỢ XUẤT PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <!-- 1. MÀN HÌNH LOGIN -->
    <div id="login-overlay">
        <div class="login-box">
            <img src="assets/images/logoUNILEVER.png" alt="Unilever Logo">
            <h2>Unime System</h2>
            <p style="font-size: 14px; color: #666; margin-bottom: 25px;">Vui lòng nhập User CODE để truy cập hệ thống</p>

            <div class="password-container">
                <input type="password" id="login-uid" class="login-input" placeholder="USER CODE" onkeypress="if(event.key === 'Enter') performLogin()">
                <i class="fa-solid fa-eye-slash" id="togglePassword" onclick="togglePasswordVisibility()"></i>
            </div>
        
            <button class="btn-login" onclick="performLogin()" id="btnLogin">ĐĂNG NHẬP</button>
            <div id="login-msg" style="color: red; font-size: 14px; margin-top: 15px;"></div>
        </div>
    </div>

    <!-- 2. GIAO DIỆN CHÍNH -->
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-btn-toggle" id="toggleBtn">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar"><img src="assets/images/logoUNILEVER.png"></div>
                    <div class="user-info-text">
                        <span class="username">Unime System</span>
                        <span class="user-description">DT Merchandising Channel</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-menu">
                <!-- Data-shot phải khớp chính xác với tên thư mục trong /shots/ -->
                <div class="menu-item" data-shot="shot1">
                    <i class="fa-solid fa-table-columns"></i> <span>Báo cáo tiến độ</span>
                </div>

                <div class="menu-group">
                    <div class="group-header">
                        <div class="header-main"><i class="fa-solid fa-diagram-project"></i> <span>UMER Ecosystem</span></div>
                        <i class="fa-solid fa-chevron-down chevron-icon"></i>
                    </div>
                    <div class="group-content">
                        <div class="menu-item sub-item" data-shot="shot7"><span>Mobile Dashboard</span></div>
                        <div class="menu-item sub-item" data-shot="shot6"><span>POSM Inventory</span></div>
                    </div>
                </div>

                <div class="menu-group">
                    <div class="group-header">
                        <div class="header-main"><i class="fa-solid fa-folder-tree"></i> <span>Khác</span></div>
                        <i class="fa-solid fa-chevron-down chevron-icon"></i>
                    </div>
                    <div class="group-content">
                        <div class="menu-item sub-item" data-shot="shot5"><span>Demo_POSM Inventory</span></div>
                        <div class="menu-item sub-item" data-shot="shot8"><span>Demo_Góc phản hồi</span></div>
                        <div class="menu-item sub-item" data-shot="shot2"><span>Shot 2</span></div>
                        <div class="menu-item sub-item" data-shot="shot3"><span>Shot 3</span></div>
                        <div class="menu-item sub-item" data-shot="shot4"><span>Shot 4</span></div>
                    </div>
                </div>
            </div>

            <!-- CHÂN SIDEBAR: USER ACCOUNT CARD -->
            <div class="sidebar-footer" id="sidebar-footer">
                <div class="user-account-card" onclick="logout()" title="Đăng xuất">
                    <div class="user-avatar-small">
                        <img src="assets/images/avtuser.png" alt="User">
                    </div>
                    <div class="user-data">
                        <span class="user-display-name" id="display-user-name">...</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- NỘI DUNG CHÍNH -->
        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <h5 id="dynamic-header-title" class="current-title">Hệ thống</h5>
                </div>
                <div class="header-right">
                    <div id="nav-groups-container"></div> <!-- Để chứa các nút tab phụ nếu cần -->
                    <button id="exportPdfBtn" class="btn-export">
                        <i class="fa-solid fa-file-pdf"></i> <span>Xuất PDF</span>
                    </button>
                </div>
            </header>

            <div id="content-area" class="content-body">
                <!-- Nội dung các shot sẽ được nạp động vào đây -->
            </div>
        </main>
    </div>

    <!-- MODAL XEM ẢNH -->
    <div id="imageModal" class="image-modal">
        <span class="close">&times;</span>
        <img id="imgFull">
    </div>

    <!-- NẠP APP JS -->
    <script src="assets/app.js"></script>

    <!-- LOGIC LOGIN & PERMISSIONS (ĐỂ ĐÂY ĐỂ CHẠY NHANH NHẤT) -->
    <script>
        const GGS_URL = "https://script.google.com/macros/s/AKfycbw33MIpDCpEPAq4uOZtoNwK1K0cblkTr1ZykUS3dxmJW4P9j1_Xr9PEYq_MZVrfjwWQwg/exec";

        function togglePasswordVisibility() {
            const inp = document.getElementById('login-uid');
            const ico = document.getElementById('togglePassword');
            if (inp.type === 'password') {
                inp.type = 'text'; ico.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                inp.type = 'password'; ico.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }

        async function performLogin() {
            const uidInput = document.getElementById('login-uid');
            const btn = document.getElementById('btnLogin');
            const msg = document.getElementById('login-msg');
            const uid = uidInput.value.trim().toUpperCase();

            if (!uid) { msg.innerText = "Vui lòng nhập User CODE!"; return; }

            msg.innerText = "";
            btn.disabled = true;
            btn.innerText = "ĐANG KIỂM TRA...";

            try {
                const response = await fetch(`${GGS_URL}?action=getRole&uid=${uid}`);
                const user = await response.json();

                if (user && user.rights) {
                    localStorage.setItem("Unime_UID", uid);
                    applyPermissions(user); 
                    document.getElementById('login-overlay').style.display = "none";
                    
                    // Tự động load shot cuối cùng đã xem hoặc shot1 mặc định
                    const lastShot = localStorage.getItem('currentShot') || 'shot1';
                    if (window.loadPage) window.loadPage(lastShot);
                } else {
                    msg.innerText = "Mã truy cập sai hoặc không có quyền!";
                    uidInput.value = "";
                }
            } catch (e) {
                msg.innerText = "Lỗi kết nối máy chủ!";
            } finally {
                btn.disabled = false;
                btn.innerText = "ĐĂNG NHẬP";
            }
        }

        function applyPermissions(user) {
            const rights = user.rights;
            
            // Hiện các menu item
            document.querySelectorAll('.menu-item[data-shot]').forEach(item => {
                const shotKey = item.getAttribute('data-shot');
                const perm = (rights[shotKey] || "").toLowerCase().trim();
                if (perm === "root" || perm === "view") {
                    item.style.setProperty('display', 'flex', 'important');
                }
            });

            // Hiện các group menu
            document.querySelectorAll('.menu-group').forEach(group => {
                const visibleSub = Array.from(group.querySelectorAll('.sub-item')).some(s => s.style.display === 'flex');
                if (hasVisibleSub) group.style.setProperty('display', 'block', 'important');
            });

            // 1. CẬP NHẬT TÊN NGƯỜI DÙNG VÀO CARD FOOTER
            const nameEl = document.getElementById('display-user-name');
            if (nameEl) nameEl.innerText = user.name || "User";

            // 2. ÉP HIỆN CÁC THÀNH PHẦN CHÍNH
            document.querySelector('.main-header').style.setProperty('display', 'flex', 'important');
            document.querySelector('.content-body').style.setProperty('display', 'block', 'important');
            
            // 3. ÉP HIỆN FOOTER (USER CARD)
            const footer = document.getElementById('sidebar-footer');
            if (footer) {
                footer.style.setProperty('display', 'block', 'important');
            }
        }

        window.logout = () => {
            if (confirm("Bạn có chắc chắn muốn đăng xuất?")) {
                localStorage.removeItem("Unime_UID");
                location.reload();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedUID = localStorage.getItem("Unime_UID");
            if (savedUID) document.getElementById('login-uid').value = savedUID;
        });
    </script>
</body>
</html>
