<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unime System Dashboard</title>
    
    <!-- FONT CHỮ CAO CẤP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">

    <!-- THƯ VIỆN HỖ TRỢ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <button class="sidebar-btn-toggle" id="toggleBtn">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="avatar">
                        <img src="assets/images/logoUNILEVER.png" alt="Logo">
                    </div>
                    <div class="user-info-text">
                        <span class="username">Unime System</span>
                        <span class="user-description">DT Merchandising Channel</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-menu">
                <!-- Mục BÁO CÁO TIẾN ĐỘ chính -->
                <div class="menu-item active" data-shot="shot1" data-title="BÁO CÁO TIẾN ĐỘ">
                    <i class="fa-solid fa-table-columns"></i> <span>BÁO CÁO TIẾN ĐỘ</span>
                </div>

                <!-- Group 1: UMER Ecosystem -->
                <div class="menu-group">
                    <div class="group-header">
                        <div class="header-main">
                            <i class="fa-solid fa-diagram-project"></i> <!-- Icon ở Group ngoài -->
                            <span>UMER Ecosystem</span> <!-- Chữ to hơn -->
                        </div>
                        <i class="fa-solid fa-chevron-down chevron-icon"></i>
                    </div>
                    <div class="group-content">
                        <div class="menu-item sub-item" data-shot="shot7" data-title="Mobile Dashboard"><span>Mobile Dashboard</span></div>
                        <div class="menu-item sub-item" data-shot="shot6" data-title="POSM Inventory"><span>POSM Inventory</span></div>
                    </div>

                </div>

                <!-- Group 2: KHÁC -->
                <div class="menu-group">
                    <div class="group-header">
                        <div class="header-main">
                            <i class="fa-solid fa-folder-tree"></i>
                            <span>KHÁC</span>
                        </div>
                        <i class="fa-solid fa-chevron-down chevron-icon"></i>
                    </div>
                    <div class="group-content">
                        <div class="menu-item sub-item" data-shot="shot5" data-title="[DEMO] POSM Inventory"><span>[DEMO] POSM Inventory</span></div>
                    </div>
                </div>

                <!-- Group 3: Nếu thêm -->
                <!-- <div class="menu-group">
                    <div class="group-header">
                        <div class="header-main">
                            <i class="fa-solid fa-bullhorn"></i>
                            <span>PROMOTE</span>
                        </div>
                        <i class="fa-solid fa-chevron-down chevron-icon"></i>
                    </div>
                    <div class="group-content">
                        <div class="menu-item sub-item" data-shot="shot..."><span>thêm</span></div>
                    </div>
                </div> -->
            </div>
        </aside>

        <!-- NỘI DUNG CHÍNH -->
        <main class="main-content">
            <header class="main-header">
            <div class="header-left">
                <h5 id="dynamic-header-title" class="current-title">BÁO CÁO TIẾN ĐỘ</h5>
            </div>

            <div class="header-right">
                <div id="shot2-nav-group" class="header-nav-container" style="display: none;">
                    <a href="#execution-roadmap" class="nav-btn active">Excution Roadmap</a>
                    <a href="#use-case-powerhouse" class="nav-btn">Use Case</a>
                    <a href="#raci-matrix" class="nav-btn">Raci Matrix</a>
                </div>
                <div id="shot3-nav-group" class="header-nav-container" style="display: none;">
                    <a href="#timeline" class="nav-btn active">Timeline</a>
                    <a href="#usecase" class="nav-btn">Use Case</a>
                    <a href="#matrix" class="nav-btn">Matrix</a>
                </div>
                <div id="shot6-nav-group" class="header-nav-container" style="display: none;">
                    <a href="#execution-roadmap" class="nav-btn active">Excution Roadmap</a>
                    <a href="#use-case-powerhouse" class="nav-btn">Use Case</a>
                    <a href="#raci-matrix" class="nav-btn">Raci Matrix</a>
                </div>

                <button id="exportPdfBtn" class="btn-export">
                    <i class="fa-solid fa-file-pdf"></i> <span>Xuất PDF</span>
                </button>
            </div>
            </header>

            <div id="content-area" class="content-body"></div>
        </main>
    </div>
    <div id="imageModal" class="image-modal">
    <span class="close">&times;</span>
    <img id="imgFull">
    </div>
    <script src="assets/app.js"></script>
</body>
</html>
