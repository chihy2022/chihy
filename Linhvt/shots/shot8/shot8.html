<div class="feedback-container-shot">
    <div class="fb-card-main">
        <div class="fb-card-header">
            <h4>BẠN MUỐN PHẢN HỒI VỀ</h4>
        </div>
        
        <div class="fb-tabs-row">
            <div class="fb-tab-item active" id="tabApp" onclick="changeCategory('APP')">
                <i class="fa-solid fa-laptop-code"></i>
                <div><strong>Ứng dụng</strong><p>Lỗi, hiệu năng</p></div>
            </div>
            <div class="fb-tab-item" id="tabPeople" onclick="changeCategory('PEOPLE')">
                <i class="fa-solid fa-users-gear"></i>
                <div><strong>Con người</strong><p>Cách làm việc</p></div>
            </div>
        </div>

        <div class="fb-body-form">
            <div id="areaApp">
                <label>Loại lỗi</label>
                <select class="fb-input-field" id="errType">
                    <option>Lỗi giao diện (hiển thị sai)</option>
                    <option>Lỗi chức năng (không bấm được)</option>
                    <option>Tốc độ xử lý chậm</option>
                </select>
            </div>
            <div id="areaPeople" style="display: none;">
                <label>Đối tượng phản hồi</label>
                <input type="text" class="fb-input-field" id="target" placeholder="Tên hoặc bộ phận...">
            </div>

            <label>Mức độ nghiêm trọng: <span id="sevText">Trung bình</span></label>
            <div class="fb-slider-group">
                <input type="range" min="1" max="4" value="2" class="fb-range-input" id="sevInput">
                <div class="fb-range-labels">
                    <span>Nhẹ</span><span>Trung bình</span><span>Nặng</span><span>Nghiêm trọng</span>
                </div>
            </div>

            <label>Nội dung chi tiết</label>
            <textarea class="fb-input-field" id="fbContent" rows="4" placeholder="Mô tả sự việc..."></textarea>

            <label>Đính kèm bằng chứng (Ảnh/Video)</label>
            <div class="fb-upload-box">
                <input type="file" id="fbFile" accept="image/*,video/*" style="display:none" onchange="processFile()">
                <button class="fb-btn-upload" onclick="document.getElementById('fbFile').click()">
                    <i class="fa-solid fa-camera"></i> Chọn Ảnh hoặc Video
                </button>
                <div id="fileInfo" class="fb-file-info"></div>
            </div>

            <label>Mong muốn thay đổi</label>
            <textarea class="fb-input-field" id="fbExpect" rows="3" placeholder="Bạn mong muốn điều gì?"></textarea>

            <div class="fb-footer-action">
                <div class="fb-anon-toggle">
                    <label class="fb-toggle">
                        <input type="checkbox" id="anonCheck">
                        <span class="fb-toggle-slider"></span>
                    </label>
                    <span>Gửi ẩn danh</span>
                </div>
                <button class="fb-btn-send" id="btnSendFB" onclick="sendFeedback()">
                    <i class="fa-solid fa-paper-plane"></i> Gửi phản hồi
                </button>
            </div>
        </div>
    </div>
</div>
