<div class="fb-container-inner">
    <div class="fb-main-card">
        <h5 class="fb-inner-title">BẠN MUỐN PHẢN HỒI VỀ</h5>

        <div class="fb-tabs-row">
            <div class="fb-tab-item active" id="btnApp" onclick="switchFB('APP')">
                <div class="fb-tab-icon icon-blue"><i class="fa-regular fa-calendar-check"></i></div>
                <div class="fb-tab-text">
                    <strong>Ứng dụng</strong>
                    <span>Lỗi, hiệu năng</span>
                </div>
            </div>
            <div class="fb-tab-item" id="btnPeople" onclick="switchFB('PEOPLE')">
                <div class="fb-tab-icon icon-pink"><i class="fa-solid fa-users-viewfinder"></i></div>
                <div class="fb-tab-text">
                    <strong>Con người</strong>
                    <span>Cách làm việc</span>
                </div>
            </div>
        </div>

        <div class="fb-form-fields">
            <div id="boxApp">
                <label class="fb-label">Loại lỗi</label>
                <select class="fb-input" id="fbErrorType">
                    <option>Lỗi giao diện (hiển thị sai)</option>
                    <option>Lỗi chức năng (không bấm được)</option>
                    <option>Tốc độ xử lý chậm</option>
                </select>
            </div>

            <div id="boxPeople" style="display: none;">
                <label class="fb-label">Đối tượng phản hồi</label>
                <input type="text" class="fb-input" id="fbTarget" placeholder="Tên hoặc bộ phận...">
            </div>

            <label class="fb-label">Mức độ nghiêm trọng: <span id="fbSevLabel">Trung bình</span></label>
            <div class="fb-slider-area">
                <input type="range" min="1" max="4" value="2" class="fb-range" id="fbSevRange" oninput="updateSev(this.value)">
                <div class="fb-range-labels">
                    <span>Nhẹ</span><span>Trung bình</span><span>Nặng</span><span>Nghiêm trọng</span>
                </div>
            </div>

            <label class="fb-label">Nội dung chi tiết sự việc</label>
            <textarea class="fb-input" id="fbDesc" rows="3" placeholder="Mô tả sự việc bạn gặp phải..."></textarea>

            <label class="fb-label">Đính kèm bằng chứng (Ảnh/Video)</label>
            <div class="fb-upload-box">
                <input type="file" id="fbFile" accept="image/*,video/*" style="display:none" onchange="onFileChange()">
                <button class="fb-upload-btn" type="button" onclick="document.getElementById('fbFile').click()">
                    <i class="fa-solid fa-camera"></i> Chọn Ảnh/Video chụp màn hình
                </button>
                <div id="fbFileName" class="fb-file-info"></div>
            </div>

            <label class="fb-label">Bạn mong muốn điều gì thay đổi?</label>
            <textarea class="fb-input" id="fbExpect" rows="2" placeholder="Ví dụ: điều chỉnh quy trình..."></textarea>

            <div class="fb-footer-action">
                <div class="fb-anon-toggle">
                    <label class="fb-switch">
                        <input type="checkbox" id="fbAnon">
                        <span class="fb-slider-round"></span>
                    </label>
                    <span>Gửi ẩn danh</span>
                </div>
                <button class="fb-send-btn" id="btnSubmitFB" onclick="submitFB()">
                    <i class="fa-solid fa-paper-plane"></i> Gửi phản hồi
                </button>
            </div>
        </div>
    </div>
</div>
