<!-- TAB 1: FORM GỬI PHẢN HỒI -->
<div class="feedback-form-card">
    <div class="fb-card-header"><h4>GỬI PHẢN HỒI HỆ THỐNG</h4></div>
    <div class="fb-tabs-selector">
        <button class="fb-tab-btn active" id="btnApp" onclick="switchFB('APP')">Ứng dụng</button>
        <button class="fb-tab-btn" id="btnPeople" onclick="switchFB('PEOPLE')">Con người</button>
    </div>
    <div class="fb-card-body">
        <div id="boxApp">
            <label>Loại lỗi</label>
            <select class="fb-input" id="fbErrorType">
                <option>Lỗi hiển thị</option><option>Lỗi chức năng</option><option>Khác</option>
            </select>
        </div>
        <div id="boxPeople" style="display:none">
            <label>Đối tượng</label>
            <input type="text" class="fb-input" id="fbTarget" placeholder="Tên bộ phận/cá nhân...">
        </div>
        
        <label>Mức độ nghiêm trọng: <b id="fbSevLabel" style="color:#00599a">Trung bình</b></label>
        <input type="range" min="1" max="4" value="2" class="fb-range" id="fbSevRange" oninput="updateSev(this.value)">
        
        <label>Nội dung chi tiết</label>
        <textarea class="fb-input" id="fbDesc" rows="3"></textarea>
        
        <label>Đính kèm bằng chứng</label>
        <div class="fb-upload-wrapper">
            <input type="file" id="fbFile" accept="image/*,video/*" style="display:none" onchange="onFileChange()">
            <button class="fb-btn-alt" onclick="document.getElementById('fbFile').click()"><i class="fa-solid fa-camera"></i> Chọn Ảnh/Video</button>
            <span id="fbFileName" style="font-size:11px; color:green; margin-left:10px"></span>
        </div>

        <label>Mong muốn thay đổi</label>
        <textarea class="fb-input" id="fbExpect" rows="2"></textarea>

        <div class="fb-footer">
            <label class="fb-anon"><input type="checkbox" id="fbAnon"> Gửi ẩn danh</label>
            <button class="btn-primary" id="btnSubmitFB" onclick="submitFB()"><i class="fa-solid fa-paper-plane"></i> Gửi ngay</button>
        </div>
    </div>
</div>

<!-- TAB 2: BẢNG DANH SÁCH PHẢN HỒI (Để xem kết quả và ảnh) -->
<div class="report-table-container" style="margin-top:30px">
    <div class="fb-card-header"><h4>DANH SÁCH PHẢN HỒI ĐÃ NHẬN</h4></div>
    <table class="custom-table">
        <thead>
            <tr>
                <th>Thời gian</th><th>Loại</th><th>Nội dung</th><th>Mức độ</th><th>Đính kèm (Ảnh)</th>
            </tr>
        </thead>
        <tbody id="feedback-table-body">
            <!-- Dữ liệu phản hồi sẽ render vào đây -->
        </tbody>
    </table>
</div>
